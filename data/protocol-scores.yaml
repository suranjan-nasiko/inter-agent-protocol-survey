acnbp:
  name: "Agent Capability Negotiation and Binding Protocol"
  spec_version: "arXiv 2506.13590v1 (2025-06-16)"
  retrieved: "2026-05-14"
  axis_1:
    score: 2
    evidence: "§III.A Def. 4 ANS = distributed directory service maintaining ANRIs (DNS-like federated); not DID-resolver-based"
    citation: "spec_acnbp"
  axis_2:
    score: 2
    evidence: "§III.A Def. 11 digital signatures; §IV.A X.509 + OCSP revocation; §VII.B ECC≥256 + SHA-3 + HMAC + hierarchical key rotation; no native DIDs (verified 2026-09-09 against the full text: zero occurrences of DID, verifiable credential, or zero-trust in the ACNBP body). The authors' companion DID+VC framework (arXiv:2505.19301, huang_zerotrust_identity) is cited by ACNBP once, in the introduction as related work, and is not normatively required, so it does not elevate this score; see sec:emerging:acnbp"
    citation: "spec_acnbp"
  axis_3:
    score: 2
    evidence: "§III.A Def. 10 Capability Binding is a mutually signed, cryptographically bound commitment with explicit capabilities and terms, backed by a capability attestation (Def. 14) and immutable audit trails. That is a structured delegation token with scope and audience, which is the level-2 anchor. It is bilateral rather than transitive, so it does not reach level 3; see revision_2026_09_10"
    citation: "spec_acnbp"
    revision_2026_09_10: "RESOLVED, score lowered from 3 to 2. The level-3 anchor requires multi-step delegation in which each intermediate agent's authorization is independently verifiable. Def. 10 is bilateral: B = <A_R, A_P, capabilities, terms, signatures>, one requester and one provider. Verified against the full ACNBP text: the body contains zero occurrences of 'delegat*', 'authoriz*', 'on behalf', 'principal', 'intermediary', 'transitive', or 'sub-agent'. The nearest multi-agent construct is 'Multi-Agent Orchestration' in §IV.C, one sentence, which describes capability composition rather than transitive authorization. A lead author confirmed in correspondence that ACNBP is a two-party negotiation-and-binding protocol and that multi-agent delegation lies outside its scope. Author statement and specification text agree. Consequence: no protocol in the scored set reaches Axis 3 level 3, and Finding 3 strengthens from 'all but one' to a universal gap."
  axis_4:
    tuple:
      transports: ["unspecified at link level"]
      serialization: "JSON (RFC 7159)"
      streaming: "no"
      async: "10-step negotiation; encrypted session with forward secrecy"
    citation: "spec_acnbp"
  axis_5:
    score: 3
    evidence: "10-step state machine with Protocol State (Def. 15); binding commitments produce artifacts; §IV.A multi-agent orchestration with capability composition"
    citation: "spec_acnbp"
  axis_6:
    score: 2
    evidence: "§IV.A subscription-based capability update notifications; no durable-resumable spec for bound execution"
    citation: "spec_acnbp"
  axis_7:
    score: 1
    evidence: "capabilities define typed input/output parameters (Def. 2); no inline multimodal parts or streaming media spec"
    citation: "spec_acnbp"
  axis_8:
    score: 10
    evidence: "explicit MAESTRO 7-layer analysis (§VII.I); ZKP capability attestation; sigs+HMAC integrity; DoS via rate limits+PoW+LB; replay via nonce+timestamp+seq; supply-chain via protocolExtension whitelist; ZKP+ring sig privacy; signed ANRIs + BFT for registry; quarantine for compromised agents; Foundation-Model layer prompt injection; cryptographically protected audit logs"
    citation: "spec_acnbp"
  axis_9:
    score: 2
    evidence: "Def. 2 structured capability descriptor; §IV.D Semantic Consistency Check; §VIII.A ontology-based classification is recommended future enhancement"
    citation: "spec_acnbp"
  axis_10:
    governance: "individual authors (DistributedApps.ai, Cisco, OWASP/AWS, Intuit); no formal SDO"
    license: "CC-BY 4.0"
    observability: 3
    evidence: "§IV.H Auditability and Logging: cryptographically protected audit logs, comprehensive event logging, privacy-preserving logging, integration with external audit/compliance systems"
    citation: "spec_acnbp"

# Commerce-settlement protocols (AP2, Visa TAP, Mastercard Agent Pay,
# ERC-8004, UCP) are not scored against the peer-messaging rubric; they
# appear in the commerce-stack table
# (manuscript/tables/table2-commerce-stack.tex) and are discussed in §6.3.
# The stub entries below exist so the taxonomy figure's leaf cross-check in
# scripts/gen_taxonomy.py resolves; per-axis scores are intentionally absent.
#
# UCP is the one commerce-layer protocol that would return a defensible score
# on several axes: it specifies discovery (/.well-known/ucp profiles),
# authorization (OAuth 2.0 identity linking with per-capability scopes), four
# transport bindings, and signed webhooks. It is
# left unscored anyway, because it is a commerce-orchestration layer and not
# a peer-messaging protocol, and because scoring one member of the
# commerce-settlement layer and not the other four would make the figures'
# averages move for reasons of scope. The choice and its cost are stated in
# sec:rubric:limits. Its per-axis evidence is recorded here so a future
# revision that widens the rubric does not start from nothing.

ap2:
  name: "AP2 (Agent Payments Protocol)"
  layer: commerce-settlement

visa_tap:
  name: "Visa Trusted Agent Protocol"
  layer: commerce-settlement

mastercard_agentpay:
  name: "Mastercard Agent Pay"
  layer: commerce-settlement

erc_8004:
  name: "ERC-8004"
  layer: commerce-settlement

ucp:
  name: "UCP (Universal Commerce Protocol)"
  layer: commerce-settlement
  spec_version: "2026-01-11, read at tag v2026-01-23 (commit dcf7eac)"
  retrieved: "2026-Q1"
  # Reproducibility hazard: both Q1 tags (v2026-01-11 = 806a5b7 and
  # v2026-01-23 = dcf7eac, both cut 2026-01-23) declare "Version: 2026-01-11"
  # in docs/specification/overview.md, but their content differs by ~8.5k
  # inserted lines, including overview.md, ap2-mandates.md and order.md.
  # GOVERNANCE.md is identical between them. The version string alone does not
  # identify what was read, so the tag and commit are recorded here and in the
  # spec_ucp bib note. Anyone re-checking these claims must check out
  # v2026-01-23, not main and not the rendered docs at ucp.dev.
  # Not rubric scored: see the note above the commerce block. The fields below
  # are evidence, not scores, and no generator reads them.
  evidence_discovery: "businesses publish a profile at /.well-known/ucp; platforms declare their own profile URI per request in a UCP-Agent header; namespace authority follows domain ownership (dev.ucp.* to the governing body, com.{vendor}.* to vendors)"
  evidence_identity: "all traffic over HTTPS; no single protocol-wide request-signing scheme. Order webhooks MUST be signed by the business as a detached JWT (RFC 7797) over the body, keyed by kid against a signing_keys JWK array in the profile. The AP2 Mandates extension signs checkout terms with JWS detached content (RFC 7515 App. F) and requires ES256/ES384/ES512. Platform-to-business requests only SHOULD be authenticated, with a bearer token as the given example. Ed25519 does not appear in the surveyed version. Shopify's specification authors, contacted about this survey, confirmed on 2026-09-19 that the asymmetry is deliberate: a webhook receiver exposes an open endpoint, so the pushed payload must carry its own proof of origin, while a platform-to-business call targets a known endpoint over TLS. He added that the SHOULD is a spec floor rather than a ceiling, and that some businesses enforce it as a MUST. The same exchange corrected the survey's framing of signing and identity linking as alternatives: a signature is agent identity (which platform sent this) and the OAuth flow is buyer identity (which buyer the platform acts for), so neither substitutes for the other, and the deployment chooses the combination (open to any agent with guest buyers; a closed signed agent list; either plus mandatory buyer sign-in, common in B2B). The score is unchanged at 1: there is still no protocol-wide request-signing scheme at the surveyed version, so a receiver cannot infer from conformance alone whether its caller authenticated."
  evidence_authorization: "OAuth 2.0 authorization-code flow for identity linking, with per-capability scopes (ucp:scopes:checkout_session) and an /.well-known/oauth-authorization-server document; no delegation chain, so a platform acting through a second platform cannot prove provenance of authority"
  evidence_transport: "four bindings: rest (OpenAPI 3.x), mcp (OpenRPC), a2a (endpoint is the Agent Card URL), embedded (OpenRPC)"
  evidence_settlement: "no settlement substrate of its own; payment authorization is delegated to the AP2 Mandates extension (dev.ucp.shopping.ap2_mandate). Once that extension is in the negotiated capability intersection the session is Security Locked, so neither party may revert to an unprotected checkout. Shopify's specification authors, contacted about this survey, confirmed on 2026-09-19 that the orchestration-layer reading is correct: UCP specifies the commerce transaction around the payment and is not a fifth competitor to AP2, Visa TAP, Mastercard Agent Pay and ERC-8004."
  evidence_capabilities: "three standard capabilities at the surveyed version: Checkout (incl. cart and tax), Order (async lifecycle webhooks), Identity Linking. The four domain Tech Councils and the wider capability set advertised on ucp.dev are post-cutoff and are not the basis of any statement in the paper."
  evidence_governance: "no formal SDO. Tech Council holds spec authority: 12 votes, 8 reserved 4 each to the two founding organisations (Google, Shopify), 4 elected every 6 months from any org. Governing Council holds project authority: 3 seats (1 Google, 1 Shopify, 1 elected annually, unfilled at the surveyed version with Google holding the proxy). Google is custodian of the ucp.dev domain. Domain Working Groups chartered by 3+ orgs, all artifacts subject to TC approval. Apache 2.0; signed contributor licence required. MAINTAINERS.md at tag v2026-01-23 lists 11 named Tech Council members (Google, Shopify, Etsy, Target, Wayfair) plus one open seat, and 2 named Governance Council members plus one open seat."
  citation: "spec_ucp"
