# Rubric scores per (protocol, axis).
# Source of truth for Table 1 (master rubric matrix), Figure 5 (heatmap),
# Figure 6 (radar charts). Scripts in /scripts/ regenerate the LaTeX
# tables and PDF figures from this YAML.
#
# Schema:
#   <protocol-id>:
#     axis_<n>:
#       score: <ordinal 0..3>  OR  tuple/string for non-ordinal axes
#       evidence: "<one-line note pointing to spec section or paper>"
#       citation: "<bibkey from refs/references.bib>"
#
# Rubric axes (see manuscript/sections/04-rubric.tex):
#   1  Discovery & Registry Model         (ordinal 0..3)
#   2  Identity & Authentication           (ordinal 0..3)
#   3  Authorization & Delegation Model    (ordinal 0..3)
#   4  Transport & Wire Format             (tuple: not ordinal)
#   5  Task & Conversation Model           (ordinal 0..3)
#   6  Async & Long-Running Operations     (ordinal 0..3)
#   7  Multi-Modal Content Handling        (ordinal 0..3)
#   8  Security Threat Surface             (count of N/12 spec-level mitigations)
#   9  Semantic Interoperability           (ordinal 0..3)
#   10 Governance / License / Observability (composite triple)
#
# All eight rubric-scored protocols carry a score, an evidence sentence, and
# a citation key on every axis. A2A, MCP, and ANP were scored first; the
# other five were scored in later passes and carry their own retrieved dates.
# The five commerce-settlement protocols are surveyed but not scored, and
# Section 4 of the paper states why. Their entries carry name and layer only,
# except UCP, which also carries per-axis evidence notes.

a2a:
  name: "Google A2A"
  spec_version: "v1.0 (2026-03-12)"
  retrieved: "2026-Q1"
  axis_1:
    score: 1
    evidence: "Well-known endpoint /.well-known/agent-card.json"
    citation: "spec_a2a"
  axis_2:
    score: 1
    evidence: "OAuth 2.x in AgentCard; mTLS/JWT supported but not mandated"
    citation: "a2a_weaknesses"
  axis_3:
    score: 1
    evidence: "Token-forwarding pattern; no standardized cryptographic delegation chain"
    citation: "authz_propagation"
  axis_4:
    tuple:
      transports: ["HTTPS/JSON-RPC 2.0", "optional gRPC", "optional REST"]
      serialization: "JSON"
      streaming: "SSE"
      async: "push notifications"
    citation: "spec_a2a"
  axis_5:
    score: 3
    evidence: "Tasks with lifecycle states, Parts, Artifacts, sub-task delegation"
    citation: "spec_a2a"
  axis_6:
    score: 3
    evidence: "Push notifications + polling + durable resumable tasks"
    citation: "spec_a2a"
  axis_7:
    score: 3
    evidence: "TextPart / FilePart / DataPart, inline + URL reference"
    citation: "spec_a2a"
  axis_8:
    score: 1
    evidence: "Addressed: message tampering, via HTTPS transport. Partial, so excluded from the count: agent impersonation (OAuth bearer, no AgentCard signature), message replay (push-notification verification only), denial of service (transport layer only). Not addressed: injection, capability escalation, delegation token theft, registry poisoning, AgentCard supply chain, side-channel privacy, cross-agent privilege confusion, audit-log tampering"
    citations: ["a2asecbench", "a2a_weaknesses"]
  axis_9:
    score: 1
    evidence: "Typed Skill objects but free-text descriptions; no ontology alignment"
    citation: "spec_a2a"
  axis_10:
    governance: "Linux Foundation"
    license: "Apache 2.0"
    observability: 2
    evidence: "SSE event stream supports tracing; no standardized audit primitives"
    citation: "spec_a2a"

mcp:
  name: "Model Context Protocol (MCP)"
  spec_version: "early-2026"
  retrieved: "2026-Q1"
  axis_1:
    score: 1
    evidence: "Server config-based + emerging registry; mostly out-of-band"
    citation: "spec_mcp"
  axis_2:
    score: 1
    evidence: "OAuth 2.1 for HTTP transport (2025); stdio relies on parent-process trust"
    citation: "spec_mcp"
  axis_3:
    score: 1
    evidence: "OAuth scopes only; no agent-delegation primitives"
    citation: "spec_mcp"
  axis_4:
    tuple:
      transports: ["stdio", "HTTP+SSE", "streamable-HTTP"]
      serialization: "JSON-RPC 2.0"
      streaming: "SSE / chunked"
      async: "notifications + emerging MCP Tasks"
    citation: "spec_mcp"
  axis_5:
    score: 1
    evidence: "Request/response with sessions; protocol stateless (MCP Tasks adds limited state)"
    citation: "spec_mcp"
  axis_6:
    score: 2
    evidence: "Notifications + emerging MCP Tasks"
    citation: "spec_mcp"
  axis_7:
    score: 2
    evidence: "Typed content blocks (text/image/resource); structured JSON-Schema tool input"
    citation: "spec_mcp"
  axis_8:
    score: 1
    evidence: "Addressed: message tampering, via TLS on the HTTP transport. Partial, so excluded from the count: agent impersonation (OAuth 2.1 over HTTP, while stdio is process-trust), message replay (token expiry only). Not applicable: AgentCard supply chain, cross-agent privilege confusion, since MCP is agent-to-tool. Not addressed: injection, tool poisoning as capability escalation, delegation token theft, registry poisoning, side-channel privacy, denial of service, audit-log tampering"
    citations: ["zhan2024injecagent", "protocol_exploits"]
  axis_9:
    score: 1
    evidence: "JSON Schema for tool input; tool descriptions free-text NL"
    citation: "spec_mcp"
  axis_10:
    governance: "Linux Foundation AAIF"
    license: "MIT-equivalent"
    observability: 1
    evidence: "Logging hooks emerging; no standardized audit primitives"
    citation: "lf_aaif"

anp:
  name: "Agent Network Protocol (ANP)"
  spec_version: "white paper 2025"
  retrieved: "2026-Q1"
  axis_1:
    score: 3
    evidence: "DID resolver + Agent Description Protocol (decentralized, verifiable)"
    citation: "spec_anp"
  axis_2:
    score: 3
    evidence: "DIDs + Verifiable Credentials (W3C standards)"
    citation: "spec_anp"
  axis_3:
    score: 2
    evidence: "VC-scoped capabilities; cryptographic chains possible but patterns not fully standardized"
    citation: "spec_anp"
  axis_4:
    tuple:
      transports: ["HTTPS"]
      serialization: "JSON-LD over JSON"
      streaming: "none native"
      async: "polling"
    citation: "spec_anp"
  axis_5:
    score: 1
    evidence: "Multi-turn supported, but a task is not a protocol-level concept; first-class concepts are Information and Interface, and a task is treated as one form of an Interface (deliberate scoping, per ANP community correspondence)"
    citation: "spec_anp"
  axis_6:
    score: 1
    evidence: "Polling primarily; no push-notification standard. Asynchrony is left to the individual Interface to define rather than raised to a protocol-level primitive (deliberate scoping)"
    citation: "spec_anp"
  axis_7:
    score: 1
    evidence: "Text + file references"
    citation: "spec_anp"
  axis_8:
    score: 5
    evidence: "Identity, authentication, integrity, audit, non-repudiation via DIDs strong; weaker on operational threats (prompt injection, registry poisoning, capability escalation)"
    citation: "spec_anp"
  axis_9:
    score: 2
    evidence: "JSON-LD ontology base; ADP enables semantic discovery. NOTE: post-cutoff ANP 1.1 (2026-06-27) moved the Agent Description document (ANP-07) to plain JSON while Discovery (ANP-08) retains JSON-LD and @context; score held at the 2026-Q1 cutoff, see sec:semantic:ontology"
    citation: "spec_anp"
  axis_10:
    governance: "community / W3C-aligned"
    license: "Apache 2.0"
    observability: 1
    evidence: "Built-in non-repudiation logs; no standardized audit dashboard"
    citation: "w3c_agent_protocol_cg"

# ------------------------------------------------------------------
# ACP and AGNTCY: scored 2026-09-03 from primary specification sources.
# Per-axis evidence is in each entry's evidence field below.
# ------------------------------------------------------------------

acp:
  name: "IBM ACP / BeeAI"
  # Archived repository (i-am-bee/acp), last push 2025-08-25; the project
  # merged into A2A under the LF umbrella as of 2025-08-29. The scores below
  # describe the specification as published, not a live effort. Wherever this
  # row is displayed the archived status must be stated.
  spec_version: "OpenAPI 3 spec at archive (repo archived 2025-08-25; merged into A2A)"
  status: "archived; superseded by A2A"
  retrieved: "2026-09-03"
  axis_1:
    score: 1
    evidence: "Well-known manifest at /.well-known/agent.yml plus GET /agents on a live server; registry-based discovery named but unspecified; no descriptor signing or content addressing"
    citation: "spec_acp"
  axis_2:
    score: 1
    evidence: "OpenAPI declares no securitySchemes at all; Basic/Bearer/JWT named only in prose, enforced by reverse proxy; identity federation under development"
    citation: "spec_acp"
  axis_3:
    score: 1
    evidence: "No authorization primitive in the spec: no scopes, no capability tokens, no propagation across the four documented composition patterns"
    citation: "spec_acp"
  axis_4:
    tuple:
      transports: ["HTTP/REST"]
      serialization: "JSON"
      streaming: "SSE (text/event-stream)"
      async: "202 + polling, event backfill, session descriptors"
    evidence: "Nine endpoints; RunMode enum sync/async/stream. NOT multipart: the spec declares only application/json and text/event-stream"
    citation: "spec_acp"
  axis_5:
    score: 3
    evidence: "Run object with eight-state lifecycle, two-phase cancellation, Await pause/resume for client input, named Artifact parts, sessions grouping runs"
    citation: "spec_acp"
  axis_6:
    score: 2
    evidence: "Async 202 + polling, SSE streaming, event backfill, and distributed sessions portable across servers by URL descriptor; but no run-level resumption and awaiting runs time out to failed"
    citation: "spec_acp"
  axis_7:
    score: 2
    evidence: "MessagePart with content_type, base64 encoding, and mutually-exclusive inline content or content_url; manifest-level input/output content-type negotiation. Level-3 anchor arguably met; held at 2 because negotiation is manifest-level, not in-band per message"
    citation: "spec_acp"
  axis_8:
    score: 1
    evidence: "Only message tampering, via TLS, and that from prose rather than spec text. No securitySchemes; SECURITY.md is a vulnerability-reporting policy. Ties a2a and mcp for the lowest count, but is alone in having no partial mitigations either, so the count is 1 of 12 against 11 not_addressed"
    citation: "spec_acp"
  axis_9:
    score: 1
    evidence: "Typed manifest with free-text description (defaulting to the function docstring); MIME content-type arrays; no ontology or controlled vocabulary"
    citation: "spec_acp"
  axis_10:
    governance: "LF AI & Data (archived)"
    license: "Apache 2.0"
    observability: 2
    evidence: "OTel integration with default exporters, OpenInference/OpenLLMetry compatible; TrajectoryMetadata and CitationMetadata carried in the wire format; no audit-integrity primitive"
    citation: "spec_acp"

agntcy:
  name: "AGNTCY / SLIM (Cisco-led)"
  # Not one document: scored across SLIM (draft-mpsb-agntcy-slim), OASF
  # (agntcy/oasf), Directory/ADS (draft-mp-agntcy-ads-02, agntcy/dir), and
  # Identity (agntcy/identity-spec). Both IETF drafts are individual
  # Independent Submissions, Informational, not WG-adopted.
  spec_version: "SLIM + OASF + ADS (draft-mp-agntcy-ads-02, 2026-07-06) + Identity"
  retrieved: "2026-09-03"
  axis_1:
    score: 3
    evidence: "ADS records content-addressed with CIDs, discovered via DHT across federated nodes with no central registry; Cosign/Sigstore signing as OCI referrer artifacts; verifiable domain names via .well-known/jwks.json"
    citation: "spec_agntcy"
  axis_2:
    score: 2
    evidence: "W3C VC Agent Badges (JSON-LD, DataIntegrityProof, JOSE) verified via ResolverMetadata assertionMethod, plus SPIFFE/SPIRE SVIDs with mTLS. Not 3: spec disclaims DID/VC constraint and worked examples anchor IDs to IdPs (Okta app ID, Duo client ID) resolving keys from a tenant JWKS"
    citation: "spec_agntcy"
  axis_3:
    score: 1
    evidence: "MLS group membership plus short-lived OAuth bearer tokens with server-side revocation; no delegation chain, and VC badges attest definitions (version, locator, schema) rather than scoped capabilities"
    citation: "spec_agntcy"
  axis_4:
    tuple:
      transports: ["gRPC over HTTP/2", "HTTP/3"]
      serialization: "protobuf + OASF JSON records"
      streaming: "SLIM sessions / SRPC"
      async: "pub-sub + MLS group messaging"
    evidence: "Two-tier security: hop-by-hop TLS 1.3 at the network layer, MLS (RFC 9420) content encryption end-to-end; routing nodes are zero-trust and forward opaque blobs. HTTP/2 is the deliberate primary choice, not HTTP/3"
    citation: "spec_agntcy"
  axis_5:
    score: 1
    evidence: "Sessions, not tasks: no task object, no lifecycle states, no terminal status, no artifact aggregation, no sub-task delegation. Task semantics are intended to come from A2A above SLIM"
    citation: "spec_agntcy"
  axis_6:
    score: 3
    evidence: "Session layer maintains persistent state across disconnections and node failures, with automatic reconnection, subscription recovery, and message queuing; MLS group membership and pending queues survive"
    citation: "spec_agntcy"
  axis_7:
    score: 0
    evidence: "No content model at all, and out of scope by design: MLS makes payloads opaque to intermediaries by construction. Recorded as 0 with that caveat; the manuscript must present it as scope, not deficiency"
    citation: "spec_agntcy"
  axis_8:
    score: 6
    evidence: "Addressed: impersonation (DID naming, MLS credentials, SPIFFE), tampering (MLS independent of TLS), replay (MLS epoch ratcheting), registry poisoning (Sigstore signing, JWKS name verification, CIDs), supply chain (mcp-scanner, skill-scanner, a2a-scanner at publish time), cross-agent privilege confusion (MLS group scoping). Partial: DoS, audit-log tampering, prompt injection"
    citation: "spec_agntcy"
  axis_9:
    score: 2
    evidence: "OASF skills and domains are published hierarchical taxonomies (18 skill categories with subcategories, 20 domain verticals); records MUST declare taxonomy skills, and DHT routing announces and queries (CID, skills) pairs. Not 3: taxonomic lookup, not semantic matching"
    citation: "spec_agntcy"
  axis_10:
    governance: "Linux Foundation"
    license: "Apache 2.0"
    observability: 3
    evidence: "Published charter, operating model, working-group process, five working groups; dedicated observe sub-project shipping an OTel SDK (ioa-observe-sdk), telemetry-hub, observe-and-eval WG, OpenSSF Scorecard on dir"
    citation: "spec_agntcy"

