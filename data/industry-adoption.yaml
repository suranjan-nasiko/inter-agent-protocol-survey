    commerce_stack: []

  commerce_payments:
    a2a:
      - { vendor: Shopify (A2A merchant agents), status: pilot, evidence: vendor_blog }
    mcp:
      - { vendor: Stripe MCP,              status: ga,        evidence: vendor_blog }
    acp: []
    agntcy: []
