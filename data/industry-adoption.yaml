      - { vendor: Bloomberg AI (selected feeds), status: pilot, evidence: vendor_blog }
    mcp:
      - { vendor: BlackRock Aladdin AI,    status: pilot,     evidence: vendor_blog, note: "internal MCP for tool integration" }
