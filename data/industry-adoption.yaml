# Industry adoption matrix source: populates manuscript/tables/table4-industry-adoption.tex.
#
# Status vocabulary (per source-tier discipline R4):
#   ga        : generally available / shipped to production
#   pilot     : in pilot or limited preview
#   announced : announced but not yet shipping
#
# `evidence` is the source for the *status* claim only (Tier-4 vendor-blog
# claims are used only for "X announced Y on date Z" facts, never for
# behavioral claims about the deployment).

verticals:
  - enterprise_saas
  - commerce_payments
  - healthcare
  - finance

protocols_compared:
  - a2a
  - mcp
  - acp
  - agntcy
  - commerce_stack

# Populated entries (2026-Q1 cutoff). Healthcare and finance carry fewer
# named deployments because both verticals favor proprietary integration
# pathways and disclose less publicly.

matrix:
  enterprise_saas:
    a2a:
      - { vendor: Salesforce Agentforce,   status: ga,        evidence: vendor_blog }
      - { vendor: ServiceNow AI Agents,    status: ga,        evidence: vendor_blog }
      - { vendor: SAP Joule,               status: pilot,     evidence: vendor_blog }
      - { vendor: Atlassian Rovo,          status: ga,        evidence: vendor_blog }
      - { vendor: Microsoft Copilot Studio, status: ga,       evidence: vendor_blog }
      - { vendor: Box AI Agents,           status: ga,        evidence: vendor_blog }
      - { vendor: Workday Agent System,    status: pilot,     evidence: vendor_blog }
    mcp:
      - { vendor: GitHub Copilot,          status: ga,        evidence: vendor_blog }
      - { vendor: Anthropic Claude Code,   status: ga,        evidence: spec_mcp }
      - { vendor: Cursor IDE,              status: ga,        evidence: vendor_blog }
      - { vendor: Replit Agent,            status: ga,        evidence: vendor_blog }
      - { vendor: Sourcegraph Cody,        status: ga,        evidence: vendor_blog }
      - { vendor: JetBrains AI Assistant,  status: ga,        evidence: vendor_blog }
    acp:
      - { vendor: IBM watsonx Orchestrate, status: ga,        evidence: spec_acp }
      - { vendor: IBM BeeAI internal,      status: pilot,     evidence: spec_acp }
    agntcy:
