    registry_poisoning:                 { coverage: addressed,     citation: spec_acnbp,     note: "signed ANRIs + BFT" }
    agentcard_supply_chain:             { coverage: addressed,     citation: spec_acnbp,     note: "protocolExtension whitelist" }
    message_tampering:                  { coverage: addressed,     citation: spec_acnbp,     note: "signatures + HMAC" }
    side_channel_privacy_leak:          { coverage: partial,       citation: spec_acnbp,     note: "ring signatures" }
    denial_of_service:                  { coverage: addressed,     citation: spec_acnbp,     note: "rate limits + PoW + LB" }
    cross_agent_privilege_confusion:    { coverage: partial,       citation: spec_acnbp,     note: "agent quarantine" }
